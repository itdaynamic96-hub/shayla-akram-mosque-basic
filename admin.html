<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>অ্যাডমিন প্যানেল | সাকছিপাড়া শায়লা আকরাম কেন্দ্রীয় জামে মসজিদ</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="./"><span class="brand-mark">☪</span><span><strong>সাকছিপাড়া শায়লা আকরাম</strong><small>প্রশাসনিক প্যানেল</small></span></a><a href="./">মূল ওয়েবসাইট</a></div></header><main class="admin-wrap"><section class="admin-card" id="loginBox"><h1>অ্যাডমিন লগইন</h1><p class="muted">শুধু অনুমোদিত প্রশাসকরা প্রবেশ করতে পারবেন। এখানে Public Sign-up নেই।</p><form id="loginForm"><label class="field">ইমেইল<input id="email" type="email" required autocomplete="username"></label><label class="field">পাসওয়ার্ড<input id="password" type="password" required autocomplete="current-password"></label><button class="btn btn-green" type="submit">নিরাপদে লগইন করুন</button><p id="loginMessage" role="status" aria-live="polite"></p></form></section><section class="admin-card hidden" id="dashboard"><div class="admin-toolbar"><div><h1>প্রশাসনিক ড্যাশবোর্ড</h1><p class="muted" id="adminIdentity">ব্যবহারকারী যাচাই হচ্ছে…</p></div><button class="btn btn-outline" id="logoutBtn" type="button">লগআউট</button></div><form id="entryForm"><h2>নতুন তথ্য যোগ করুন</h2><label class="field">মডিউল<select id="module" required></select></label><label class="field">শিরোনাম<input id="title" maxlength="180" required></label><label class="field">বিবরণ <span class="muted">সর্বোচ্চ ৫০০ শব্দ</span><textarea id="body" required></textarea><small id="wordCount" class="muted">০ / ৫০০ শব্দ</small></label><label class="field">অতিরিক্ত তথ্য (ঐচ্ছিক JSON)<textarea id="metadata" placeholder='{"ফজর":"সময়","যোহর":"সময়","আসর":"সময়","মাগরিব":"সময়","ইশা":"সময়"}'></textarea><small class="muted">নামাজের সময় বা বিশেষ তথ্যের জন্য JSON ব্যবহার করুন। ফাঁকা রাখলে স্বয়ংক্রিয়ভাবে খালি থাকবে।</small></label><label class="field">অবস্থা<select id="status" required></select></label><button class="btn btn-green" type="submit">তথ্য সংরক্ষণ করুন</button><p id="saveMessage" role="status" aria-live="polite"></p></form><h2>সাম্প্রতিক তথ্য</h2><p class="muted">আপনার ভূমিকা অনুযায়ী অনুমোদন, প্রকাশ বা মুছে ফেলার বোতাম দেখানো হবে।</p><div id="entries"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
